# "Runs on Atlassian" by design (ADR-002): Forge functions and Custom UI only,
# no remotes, no external domains, no Forge storage. The keep-sorted rule is a
# content property on the parent page.
modules:
  confluence:contentAction:
    - key: sort-child-pages
      title:
        i18n: sort-child-pages.title
      resource: main
      viewportSize: large
  # Second, visible entry point under the page title: Confluence files every
  # content action under ••• > Apps.
  confluence:contentBylineItem:
    - key: sort-child-pages-byline
      title:
        i18n: sort-child-pages.byline
      resource: main
      viewportSize: large
  trigger:
    - key: keep-sorted
      function: on-page-changed
      events:
        - avi:confluence:created:page
        - avi:confluence:moved:page
        - avi:confluence:updated:page
      # ignoreSelf only works with Jira events, so the app's own moves wake it up
      # too. That costs one extra run per parent: a sorted tree plans zero moves.
  consumer:
    - key: sort-parent-consumer
      queue: sort-parent
      resolver:
        function: sort-worker
        method: sort-parent
  function:
    - key: on-page-changed
      handler: trigger.onPageChanged
    - key: sort-worker
      handler: worker.handler
      # Large sorts move pages one by one and wait on rate limits.
      timeoutSeconds: 900
resources:
  - key: main
    path: static/sorter-ui/dist
permissions:
  scopes:
    - read:confluence-content.summary # required by the page triggers
    - read:page:confluence # child pages, creation dates, page parent
    - write:page:confluence # keep-sorted rule (page content property)
    - read:hierarchical-content:confluence # direct children, in sidebar order
    - read:folder:confluence # creation date of child folders
    - read:whiteboard:confluence
    - read:database:confluence
    - read:embed:confluence
    - write:confluence-content # move a page before/after a sibling (REST v1)
translations:
  resources:
    - key: en-US
      path: locales/en-US.json
    - key: fr-FR
      path: locales/fr-FR.json
  fallback:
    default: en-US
app:
  id: ari:cloud:ecosystem::app/31ffdd52-f918-4a88-9df7-ab6d984d68f4
  runtime:
    name: nodejs22.x
