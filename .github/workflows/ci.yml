name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: static/sorter-ui
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  forge:
    # Lint the manifest and check "Runs on Atlassian" eligibility once the
    # vendor account secrets exist (FORGE_EMAIL, FORGE_API_TOKEN).
    needs: test
    if: ${{ vars.FORGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm --prefix static/sorter-ui ci && npm run build
      - run: npx forge lint
      - run: npx forge deploy --environment development --non-interactive
      - run: npx forge eligibility --environment development
